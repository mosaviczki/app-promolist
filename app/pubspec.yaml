name: projeto_dispositivos_moveis
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.7
  firebase_core: ^2.16.0
  firebase_auth: ^4.10.0
  provider: ^6.0.5
  google_nav_bar: ^5.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.3.2
  flutter_launcher_icons: "^0.13.1"

flutter_native_splash:
  color: "#001D29"
  image: "assets/logo/logo.png"
  android: true
  ios: true

flutter_launcher_icons:
  image_path: "assets/logo/icon_logo.png"
  color: "#0D1117"
  ios: true
  remove_alpha_ios: true
  android: "launcher_icon"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foregroud: "assets/logo/icon_logo.png"


flutter:
  uses-material-design: true
  assets:
    - assets/cart_welcome.png
    - assets/login.png
    - assets/signup.png
    - assets/reset_password.png
    - assets/logo/icon_logo_dark.png

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/poppins_light.ttf
          weight: 300
        - asset: fonts/poppins_regular.ttf
          weight: 400
        - asset: fonts/poppins_medium.ttf
          weight: 500
        - asset: fonts/poppins_semiBold.ttf
          weight: 600
        - asset: fonts/poppins_bold.ttf
          weight: 700
